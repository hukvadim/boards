<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мої дошки</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230c66e4'/><rect x='6' y='7' width='8' height='18' rx='2' fill='white'/><rect x='18' y='7' width='8' height='11' rx='2' fill='white'/></svg>">
<style>
:root {
  --col: #f1f2f4; --card: #fff; --text: #172b4d; --muted: #626f86; --line: #091e4224;
  --bar: #fff; --bar-text: #172b4d; --active: #e9f2ff; --active-text: #0c66e4; --shadow: 0 1px 1px #091e4240, 0 0 1px #091e424f;
}
@media (prefers-color-scheme: dark) {
    :root { --col: #161a1d; --card: #22272b; --text: #dee4ea; --muted: #9fadbc;
    --line: #a6c5e229; --bar: #22272b; --bar-text: #dee4ea; --active: #1c2b41; --active-text: #579dff; --shadow: 0 1px 1px #03040480; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #5c6fc9; color: var(--text); font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
/* Меш-градієнт + зерно (як у image-mesh-gradient.png) */
#mesh { position: fixed; inset: 0; z-index: -1; transition: background .6s; }
#mesh::after { content: ""; position: absolute; inset: 0; opacity: .18; mix-blend-mode: overlay;
  background: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%27200%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.9%27 numOctaves=%272%27 stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23n)%27/%3E%3C/svg%3E"); }
header { padding: 14px 16px 8px; color: #fff; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 20px; }
header small { opacity: .8; }
.lists { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding: 8px 16px 110px; scroll-snap-type: x mandatory; height: calc(100% - 56px); }
.list { flex: 0 0 272px; background: var(--col); border-radius: 12px; padding: 8px; scroll-snap-align: start; max-height: 100%; display: flex; flex-direction: column; }
.list h2 { font-size: 14px; margin: 4px 8px 8px; display: flex; align-items: center; gap: 8px; }
.list h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.list h2 .n { margin-left: auto; color: var(--muted); font-weight: 400; }
.cards { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 2px 2px; }
.card { background: var(--card); border-radius: 8px; padding: 8px 12px; box-shadow: var(--shadow); cursor: pointer; border: 0; color: inherit; font: inherit; text-align: left; width: 100%; }
.card:hover { outline: 2px solid var(--active-text); }
.card.done .t { color: var(--muted); text-decoration: line-through; }
.badges { display: flex; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.badges .stop { background: #fff7d6; color: #533f04; border-radius: 4px; padding: 0 6px; }
dialog { border: 0; border-radius: 12px; padding: 0; width: min(640px, calc(100% - 24px)); max-height: calc(100% - 48px); background: var(--col); color: var(--text); box-shadow: 0 12px 32px #0006; }
dialog::backdrop { background: #000a; }
.m-head { padding: 20px 56px 8px 20px; position: relative; }
.m-head h3 { margin: 0; font-size: 20px; line-height: 1.3; }
.m-head .in { color: var(--muted); margin-top: 6px; font-size: 13px; }
.m-close { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 8px; border: 0; background: none; color: inherit; font-size: 20px; cursor: pointer; }
.m-close:hover { background: var(--line); }
.m-body { padding: 8px 20px 20px; }
.m-body h4 { margin: 16px 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.m-stop { background: #fff7d6; color: #533f04; border-radius: 8px; padding: 10px 12px; }
.m-desc { background: var(--card); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
.m-empty { color: var(--muted); }
.m-copy { margin-top: 16px; border: 0; border-radius: 8px; padding: 8px 14px; background: var(--active); color: var(--active-text); font: inherit; font-weight: 500; cursor: pointer; }
.empty { color: var(--muted); font-size: 12px; padding: 4px 8px 8px; }
.list.work .dot { background: #579dff; } .list.bugs .dot { background: #f87168; } .list.ideas .dot { background: #9f8fef; } .list.done .dot { background: #4bce97; }
.list.bugs .card { border-left: 3px solid #f87168; }
.list.work .card { border-left: 3px solid #579dff; }
nav { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--bar); color: var(--bar-text);
  border-radius: 14px; padding: 6px; display: flex; gap: 4px; box-shadow: 0 8px 24px #0000004d; max-width: calc(100% - 32px); }
nav button { border: 0; background: none; color: inherit; font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
nav button.on { background: var(--active); color: var(--active-text); }
nav .sep { width: 1px; background: var(--line); margin: 6px 2px; }
.sheet { position: fixed; inset: 0; background: #0006; display: none; align-items: flex-end; justify-content: center; }
.sheet.open { display: flex; }
.sheet ul { list-style: none; margin: 0 0 90px; padding: 8px; background: var(--bar); color: var(--bar-text); border-radius: 14px; width: min(360px, calc(100% - 32px)); }
.sheet li { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; }
.sheet li:hover, .sheet li.on { background: var(--active); color: var(--active-text); }
@media (max-width: 420px) { .long { display: none; } }
.sheet li small { margin-left: auto; color: var(--muted); }
</style>
</head>
<body>
<div id="mesh"></div>
<header><h1 id="title">…</h1><small id="meta"></small></header>
<main class="lists" id="lists"></main>
<nav>
  <button class="on" id="cur">▦ <span>Дошка</span></button>
  <span class="sep"></span>
  <button id="switch">⇄ <span class="long">Переключити </span>дошки</button>
  <span class="sep"></span>
  <button id="gen" title="Новий градієнт">🎨</button>
  <button id="pin" title="Зафіксувати градієнт">📌</button>
</nav>
<div class="sheet" id="sheet"><ul id="boards"></ul></div>
<dialog id="modal">
  <div class="m-head"><h3></h3><div class="in"></div><button class="m-close" aria-label="Закрити">✕</button></div>
  <div class="m-body"></div>
</dialog>
<script>
const KIND = { 'в роботі': 'work', 'баги': 'bugs', 'ідеї': 'ideas', 'готово': 'done' };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let data, current;
const isStop = (k) => /^зупинився/i.test(k.note);

function render(id) {
  const b = data.boards.find((x) => x.id === id) ?? data.boards[0];
  if (!b) { document.getElementById('title').textContent = 'Нема жодного TASKS.md'; return; }
  store.set('board', b.id);
  document.title = `${b.title} · Дошки`;
  document.getElementById('title').textContent = b.title;
  document.getElementById('cur').querySelector('span').textContent = b.title;
  document.getElementById('meta').textContent = 'оновлено ' + new Date(b.updated).toLocaleString('uk-UA', { dateStyle: 'short', timeStyle: 'short' });
  current = b;
  document.getElementById('lists').innerHTML = b.columns.map((c, ci) => `
    <section class="list ${KIND[c.title.toLowerCase()] ?? ''}">
      <h2><span class="dot"></span>${esc(c.title)}<span class="n">${c.cards.length}</span></h2>
      <div class="cards">${c.cards.map((k, ki) => `
        <button class="card ${k.done ? 'done' : ''}" data-c="${ci}" data-k="${ki}"><div class="t">${esc(k.title)}</div>
          ${isStop(k) || k.note || k.desc ? `<div class="badges">${isStop(k) ? '<span class="stop">⏸ зупинився</span>' : ''}${(k.note && !isStop(k)) || k.desc ? '<span>≡</span>' : ''}</div>` : ''}
        </button>`).join('') || '<div class="empty">порожньо</div>'}
      </div>
    </section>`).join('');
  document.getElementById('boards').innerHTML = data.boards.map((x) => {
    const work = x.columns.find((c) => KIND[c.title.toLowerCase()] === 'work')?.cards.length ?? 0;
    return `<li data-id="${esc(x.id)}" class="${x.id === b.id ? 'on' : ''}">▦ ${esc(x.title)}<small>${work ? work + ' в роботі' : ''}</small></li>`;
  }).join('');
}

// Модалка картки — лише перегляд; змінювати в TASKS.md.
const modal = document.getElementById('modal');
document.getElementById('lists').onclick = (e) => {
  const el = e.target.closest('.card');
  if (!el) return;
  const col = current.columns[el.dataset.c];
  const k = col.cards[el.dataset.k];
  modal.querySelector('h3').textContent = (k.done ? '✓ ' : '') + k.title;
  modal.querySelector('.in').textContent = `у колонці «${col.title}» · ${current.title}`;
  const stop = isStop(k) ? k.note.replace(/^зупинився:?\s*/i, '') : '';
  const desc = [isStop(k) ? '' : k.note, k.desc].filter(Boolean).join('\n');
  modal.querySelector('.m-body').innerHTML =
    (stop ? `<h4>⏸ Де зупинився</h4><div class="m-stop">${esc(stop)}</div>` : '') +
    `<h4>≡ Опис</h4>${desc ? `<div class="m-desc">${esc(desc)}</div>` : '<div class="m-empty">Опису нема. Додай рядки з відступом під задачею в TASKS.md.</div>'}` +
    `<button class="m-copy">Копіювати для Claude</button>`;
  modal.querySelector('.m-copy').onclick = (ev) => {
    navigator.clipboard?.writeText(`${current.title}: ${k.title}${k.note ? ' — ' + k.note : ''}${k.desc ? '\n' + k.desc : ''}`);
    ev.target.textContent = 'Скопійовано ✓';
  };
  modal.showModal();
};
modal.onclick = (e) => { if (e.target === modal || e.target.closest('.m-close')) modal.close(); };

// ---------- Меш-градієнт. seed 0 = еталон з image-mesh-gradient.png; інші — генеруються.
// Щоб зафіксувати для всіх пристроїв: заміни DEFAULT_SEED на число з підказки кнопки 📌.
const DEFAULT_SEED = 0;
const SAMPLE = 'radial-gradient(at 0% 38%, #dc8ad8 0, transparent 32%), radial-gradient(at 85% 8%, #6d93e2 0, transparent 60%), radial-gradient(at 48% 42%, #8d87df 0, transparent 42%), radial-gradient(at 18% 88%, #172c66 0, transparent 62%), radial-gradient(at 68% 82%, #283d80 0, transparent 50%), #5d6fca';
function rng(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function mesh(seed) {
  if (!seed) return SAMPLE;
  const r = rng(seed), h = r() * 360, hsl = (dh, s, l) => `hsl(${(h + dh + 360) % 360} ${s}% ${l}%)`;
  const blobs = Array.from({ length: 5 }, (_, i) => {
    const light = i < 2 ? 18 + r() * 12 : 50 + r() * 20; // 2 темні плями + 3 світлі, як в еталоні
    return `radial-gradient(at ${Math.round(r() * 100)}% ${Math.round(r() * 100)}%, ${hsl((r() - 0.5) * 140, 50 + r() * 30, light)} 0, transparent ${Math.round(35 + r() * 30)}%)`;
  });
  return `${blobs.reverse().join(', ')}, ${hsl(0, 50, 45)}`;
}
let seed = Number(store.get('meshSeed') ?? DEFAULT_SEED);
const pinned = () => String(seed) === (store.get('meshSeed') ?? String(DEFAULT_SEED));
function paint() {
  document.getElementById('mesh').style.background = mesh(seed);
  const pin = document.getElementById('pin');
  pin.classList.toggle('on', pinned());
  pin.title = pinned() ? `Зафіксовано (seed ${seed})` : `Зафіксувати (seed ${seed})`;
}
document.getElementById('gen').onclick = () => { seed = 1 + Math.floor(Math.random() * 99999); paint(); };
document.getElementById('pin').onclick = () => { store.set('meshSeed', seed); paint(); };
paint();

const sheet = document.getElementById('sheet');
document.getElementById('switch').onclick = () => sheet.classList.add('open');
sheet.onclick = (e) => { const li = e.target.closest('li'); if (li) render(li.dataset.id); sheet.classList.remove('open'); };

fetch('boards.json', { cache: 'no-store' }).then((r) => r.json()).then((d) => { data = d; render(new URLSearchParams(location.search).get('b') ?? store.get('board')); })
  .catch(() => { document.getElementById('title').textContent = 'Запусти: node build.mjs'; });
</script>
</body>
</html>
